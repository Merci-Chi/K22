<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../css.css" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="icon" href="../icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#292623" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="K22" />
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <title>Today — Life Organizer</title>
</head>
<body data-page="today">
  <div class="app-shell">
    
<aside class="sidebar">
  <div class="brand-mark"><i data-lucide="cat"></i></div>
  <nav class="side-nav">
    <a class="nav-item " href="../home/home.html"><i data-lucide="house"></i><span>Home</span></a>
    <a class="nav-item " href="../calendar/calendar.html"><i data-lucide="calendar-days"></i><span>Calendar</span></a>
    <a class="nav-item active" href="../today/today.html"><i data-lucide="square-check-big"></i><span>Today</span></a>
    <a class="nav-item " href="../notes/notes.html"><i data-lucide="notebook-pen"></i><span>Notes</span></a>
    <a class="nav-item " href="../categories/categories.html"><i data-lucide="layout-grid"></i><span>Categories</span></a>
  </nav>
</aside>

    <main class="main-content">
      
<header class="topbar">
  <div class="greeting">
    <h1>Today <i data-lucide="sun" class="title-icon"></i></h1>
    <p>Only what matters for today — no clutter.</p>
  </div>
  <div class="top-actions">
    <label class="search-wrap">
      <i data-lucide="search"></i>
      <input id="globalSearch" type="search" placeholder="Search this page..." />
    </label>
    <button class="round-btn" aria-label="Notifications"><i data-lucide="bell"></i><span class="notif-dot"></span></button>
    <button class="avatar-btn" aria-label="Profile"><i data-lucide="user-round"></i></button>
  </div>
</header>

<section class="today-page-grid">
  <article class="panel todo-hub">
    <div class="panel-title-row todo-hub-head">
      <div>
        <h2><i data-lucide="list-todo"></i> To-Do</h2>
        <p class="todo-hub-subtitle" id="todoSummary">Everything in one place.</p>
      </div>
      <button class="link-btn" id="addTaskBtn"><i data-lucide="plus"></i> Add Task</button>
    </div>

    <div class="todo-tabs" id="todoTabs">
      <button class="todo-tab active" data-todo-view="inbox"><i data-lucide="inbox"></i><span>Inbox</span><b data-count="inbox">0</b></button>
      <button class="todo-tab" data-todo-view="today"><i data-lucide="sun"></i><span>Today</span><b data-count="today">0</b></button>
      <button class="todo-tab" data-todo-view="upcoming"><i data-lucide="calendar-clock"></i><span>Upcoming</span><b data-count="upcoming">0</b></button>
      <button class="todo-tab" data-todo-view="someday"><i data-lucide="cloud"></i><span>Someday</span><b data-count="someday">0</b></button>
      <button class="todo-tab" data-todo-view="completed"><i data-lucide="circle-check-big"></i><span>Completed</span><b data-count="completed">0</b></button>
    </div>

    <form id="todoQuickAdd" class="quick-add todo-quick-add">
      <i data-lucide="plus"></i>
      <input id="todoQuickInput" type="text" placeholder="Quick add to Inbox..." />
    </form>

    <div id="todoTaskList" class="todo-task-list"></div>
  </article>

  <article class="panel routine-panel">
    <div class="panel-title-row">
      <div>
        <h2><i data-lucide="repeat-2"></i> Routine</h2>
        <p class="routine-subtitle" id="routineDateLabel">Repeats automatically</p>
      </div>
      <button class="link-btn" id="addRoutineBtn"><i data-lucide="plus"></i> Add</button>
    </div>

    <div class="routine-filter-row" id="routineFilterRow">
      <button class="routine-filter active" data-routine-filter="all">All</button>
      <button class="routine-filter" data-routine-filter="morning">Morning</button>
      <button class="routine-filter" data-routine-filter="afternoon">Afternoon</button>
      <button class="routine-filter" data-routine-filter="evening">Evening</button>
    </div>

    <div class="routine-list" id="routineList"></div>
  </article>

  <article class="panel today-summary">
    <h2><i data-lucide="sparkles"></i> Quick Focus</h2>
    <textarea id="focusNote" placeholder="What do you want to remember today?"></textarea>
    <button class="save-btn compact-save" id="saveFocus">Save Focus</button>
  </article>
</section>

    </main>
    
<nav class="mobile-nav">
  <a class="" href="../home/home.html"><i data-lucide="house"></i><span>Home</span></a>
  <a class="" href="../calendar/calendar.html"><i data-lucide="calendar-days"></i><span>Calendar</span></a>
  <a class="active" href="../today/today.html"><i data-lucide="square-check-big"></i><span>Today</span></a>
  <a class="" href="../notes/notes.html"><i data-lucide="notebook-pen"></i><span>Notes</span></a>
  <a class="" href="../categories/categories.html"><i data-lucide="layout-grid"></i><span>Categories</span></a>
</nav>

  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Card</h3>
        <button id="closeModal" aria-label="Close"><i data-lucide="x"></i></button>
      </div>
      <textarea id="modalNotes" placeholder="Write notes here..."></textarea>
      <button class="save-btn" id="saveNotes">Save</button>
    </div>
  </div>



  <div class="event-modal-backdrop hidden" id="taskModalBackdrop">
    <div class="event-modal task-modal">
      <div class="event-modal-head">
        <div>
          <small>Task</small>
          <h2 id="taskModalTitle">Add Task</h2>
        </div>
        <button class="modal-close" id="closeTaskModal" aria-label="Close"><i data-lucide="x"></i></button>
      </div>

      <form id="taskForm" class="event-form">
        <input type="hidden" id="taskId">

        <label class="event-field event-field-full">
          <span>Task</span>
          <input id="taskTextInput" type="text" placeholder="What needs to get done?" required>
        </label>

        <label class="event-field">
          <span>List</span>
          <select id="taskBucketInput">
            <option value="inbox">Inbox</option>
            <option value="today">Today</option>
            <option value="someday">Someday</option>
          </select>
        </label>

        <label class="event-field">
          <span>Due date</span>
          <input id="taskDueDateInput" type="date">
        </label>

        <label class="event-field">
          <span>Priority</span>
          <select id="taskPriorityInput">
            <option value="none">No priority</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>

        <label class="event-field">
          <span>Category</span>
          <input id="taskCategoryInput" type="text" placeholder="Business, Personal, Car...">
        </label>

        <label class="event-field event-field-full">
          <span>Repeat</span>
          <select id="taskRepeatInput">
            <option value="none">Does not repeat</option>
            <option value="daily">Every day</option>
            <option value="weekdays">Every weekday</option>
            <option value="weekly">Every week</option>
            <option value="monthly">Every month</option>
          </select>
        </label>

        <label class="event-field event-field-full">
          <span>Subtasks <small>one per line</small></span>
          <textarea id="taskSubtasksInput" placeholder="Example:
Call office
Send paperwork
Confirm appointment"></textarea>
        </label>

        <label class="event-field event-field-full">
          <span>Notes</span>
          <textarea id="taskNotesInput" placeholder="Anything else you want to remember..."></textarea>
        </label>

        <div class="event-form-actions">
          <button type="button" class="soft-btn danger-soft hidden" id="deleteTaskBtn">
            <i data-lucide="trash-2"></i> Delete
          </button>
          <div class="event-form-actions-right">
            <button type="button" class="soft-btn" id="cancelTaskBtn">Cancel</button>
            <button type="submit" class="save-btn" id="saveTaskBtn">Save Task</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="event-modal-backdrop hidden" id="routineModalBackdrop">
    <div class="event-modal routine-modal">
      <div class="event-modal-head">
        <div>
          <small>Recurring Routine</small>
          <h2 id="routineModalTitle">Add Routine</h2>
        </div>
        <button class="modal-close" id="closeRoutineModal" aria-label="Close"><i data-lucide="x"></i></button>
      </div>

      <form id="routineForm" class="event-form">
        <input type="hidden" id="routineId">

        <label class="event-field event-field-full">
          <span>Routine</span>
          <input id="routineLabelInput" type="text" placeholder="Example: Drink water" required>
        </label>

        <label class="event-field">
          <span>Time of day</span>
          <select id="routinePeriodInput">
            <option value="morning">Morning</option>
            <option value="afternoon">Afternoon</option>
            <option value="evening">Evening</option>
            <option value="anytime">Anytime</option>
          </select>
        </label>

        <label class="event-field">
          <span>Repeat</span>
          <select id="routineRepeatPreset">
            <option value="daily">Every day</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekends">Weekends</option>
            <option value="custom">Custom days</option>
          </select>
        </label>

        <div class="event-field event-field-full">
          <span>Days</span>
          <div class="routine-days" id="routineDays">
            <label><input type="checkbox" value="0"><span>Sun</span></label>
            <label><input type="checkbox" value="1"><span>Mon</span></label>
            <label><input type="checkbox" value="2"><span>Tue</span></label>
            <label><input type="checkbox" value="3"><span>Wed</span></label>
            <label><input type="checkbox" value="4"><span>Thu</span></label>
            <label><input type="checkbox" value="5"><span>Fri</span></label>
            <label><input type="checkbox" value="6"><span>Sat</span></label>
          </div>
        </div>

        <div class="event-form-actions">
          <button type="button" class="soft-btn danger-soft hidden" id="deleteRoutineBtn">
            <i data-lucide="trash-2"></i> Delete
          </button>
          <div class="event-form-actions-right">
            <button type="button" class="soft-btn" id="cancelRoutineBtn">Cancel</button>
            <button type="submit" class="save-btn" id="saveRoutineBtn">Save Routine</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="today.js"></script>
  <script src="../shared/search.js"></script>
  <script src="../js.js"></script>
</body>
</html>
