<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css.css" />
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <title>Categories — Life Organizer</title>
</head>
<body data-page="categories">
  <div class="app-shell">
    
<aside class="sidebar">
  <div class="brand-mark"><i data-lucide="cat"></i></div>
  <nav class="side-nav">
    <a class="nav-item " href="index.html"><i data-lucide="house"></i><span>Home</span></a>
    <a class="nav-item " href="calendar.html"><i data-lucide="calendar-days"></i><span>Calendar</span></a>
    <a class="nav-item " href="today.html"><i data-lucide="square-check-big"></i><span>Today</span></a>
    <a class="nav-item " href="notes.html"><i data-lucide="notebook-pen"></i><span>Notes</span></a>
    <a class="nav-item active" href="categories.html"><i data-lucide="layout-grid"></i><span>Categories</span></a>
  </nav>
</aside>

    <main class="main-content">
      
<header class="topbar">
  <div class="greeting">
    <h1>Categories <i data-lucide="layout-grid" class="title-icon"></i></h1>
    <p>Everything in your life organizer, sorted into one library.</p>
  </div>
  <div class="top-actions">
    <label class="search-wrap">
      <i data-lucide="search"></i>
      <input id="globalSearch" type="search" placeholder="Search this page..." />
    </label>
    <button class="round-btn" aria-label="Notifications"><i data-lucide="bell"></i><span class="notif-dot"></span></button>
    <button class="avatar-btn" aria-label="Profile"><i data-lucide="user-round"></i></button>
  </div>
</header>

<section class="categories-page">
  <article class="category panel">
    <div class="category-header"><h2><i data-lucide="user-round"></i> Personal</h2></div>
    <div class="square-grid">
      <button class="square-card pink" data-card="Love"><i data-lucide="heart"></i><b>Love</b></button>
      <button class="square-card lilac" data-card="Medical"><i data-lucide="stethoscope"></i><b>Medical</b></button>
      <button class="square-card gold" data-card="Goals"><i data-lucide="target"></i><b>Goals</b></button>
      <button class="square-card blue" data-card="Routine"><i data-lucide="sun"></i><b>Routine</b></button>
      <button class="square-card pink" data-card="Education"><i data-lucide="graduation-cap"></i><b>Education</b></button>
      <button class="square-card lilac" data-card="Trackers"><i data-lucide="chart-no-axes-column-increasing"></i><b>Trackers</b></button>
    </div>
  </article>

  <article class="category panel">
    <div class="category-header"><h2><i data-lucide="house"></i> Home &amp; Lifestyle</h2></div>
    <div class="square-grid">
      <button class="square-card pink" data-card="Cooking"><i data-lucide="cooking-pot"></i><b>Cooking</b></button>
      <button class="square-card green" data-card="My Food Order"><i data-lucide="cup-soda"></i><b>My Food Order</b></button>
      <button class="square-card gold" data-card="Lifestyle Notes"><i data-lucide="notebook-pen"></i><b>Lifestyle Notes</b></button>
      <button class="square-card pink" data-card="Fashion"><i data-lucide="shirt"></i><b>Fashion</b></button>
      <button class="square-card lilac" data-card="Parties"><i data-lucide="party-popper"></i><b>Parties</b></button>
      <button class="square-card blue" data-card="Wishlist"><i data-lucide="shopping-bag"></i><b>Wishlist</b></button>
    </div>
  </article>

  <article class="category panel">
    <div class="category-header"><h2><i data-lucide="briefcase-business"></i> Work &amp; Money</h2></div>
    <div class="square-grid">
      <button class="square-card blue" data-card="Business"><i data-lucide="laptop"></i><b>Business</b></button>
      <button class="square-card lilac" data-card="Websites"><i data-lucide="globe-2"></i><b>Websites</b></button>
      <button class="square-card green" data-card="Investments"><i data-lucide="chart-no-axes-column-increasing"></i><b>Investments</b></button>
      <button class="square-card gold" data-card="Networking"><i data-lucide="users"></i><b>Networking</b></button>
      <button class="square-card pink" data-card="Legal"><i data-lucide="file-text"></i><b>Legal</b></button>
      <button class="square-card blue" data-card="Nellis Auction"><i data-lucide="tags"></i><b>Nellis Auction</b></button>
    </div>
  </article>

  <article class="category panel">
    <div class="category-header"><h2><i data-lucide="lightbulb"></i> Ideas</h2></div>
    <div class="square-grid">
      <button class="square-card pink" data-card="Ideas"><i data-lucide="lightbulb"></i><b>Ideas</b></button>
      <button class="square-card lilac" data-card="Gifts"><i data-lucide="gift"></i><b>Gifts</b></button>
      <button class="square-card green" data-card="Wedding"><i data-lucide="gem"></i><b>Wedding</b></button>
      <button class="square-card gold" data-card="Kids"><i data-lucide="baby"></i><b>Kids</b></button>
      <button class="square-card pink" data-card="Home"><i data-lucide="house"></i><b>Home</b></button>
      <button class="square-card blue" data-card="Car"><i data-lucide="car-front"></i><b>Car</b></button>
    </div>
  </article>
</section>

    </main>
    
<nav class="mobile-nav">
  <a class="" href="index.html"><i data-lucide="house"></i><span>Home</span></a>
  <a class="" href="calendar.html"><i data-lucide="calendar-days"></i><span>Calendar</span></a>
  <a class="" href="today.html"><i data-lucide="square-check-big"></i><span>Today</span></a>
  <a class="" href="notes.html"><i data-lucide="notebook-pen"></i><span>Notes</span></a>
  <a class="active" href="categories.html"><i data-lucide="layout-grid"></i><span>Categories</span></a>
</nav>

  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="category-modal">
      <div class="category-modal-head">
        <div class="category-modal-title">
          <div class="category-modal-icon"><i data-lucide="folder-open"></i></div>
          <div>
            <small>Category</small>
            <h3 id="modalTitle">Category</h3>
          </div>
        </div>
        <button class="modal-close" id="closeModal" aria-label="Close"><i data-lucide="x"></i></button>
      </div>

      <div class="category-modal-grid">
        <section class="category-modal-section">
          <div class="category-section-title">
            <h4><i data-lucide="list-checks"></i> Items</h4>
            <span id="categoryItemCount">0 items</span>
          </div>

          <form id="categoryItemForm" class="category-quick-add">
            <i data-lucide="plus"></i>
            <input id="categoryItemInput" type="text" placeholder="Add something..." />
            <button type="submit">Add</button>
          </form>

          <div id="categoryItems" class="category-items"></div>
          <div id="categoryEmpty" class="category-empty">
            <i data-lucide="inbox"></i>
            <b>Nothing here yet</b>
            <span>Add your first item above.</span>
          </div>
        </section>

        <section class="category-modal-section notes-section">
          <div class="category-section-title">
            <h4><i data-lucide="notebook-pen"></i> Notes</h4>
          </div>
          <textarea id="modalNotes" placeholder="Write notes for this category..."></textarea>
          <button class="save-btn" id="saveNotes">Save Notes</button>
        </section>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js.js"></script>
</body>
</html>
